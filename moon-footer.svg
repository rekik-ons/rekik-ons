<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%" role="img" aria-label="footer" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.s{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.float{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.halo{animation:halo 5s ease-in-out infinite;transform-origin:center}
@keyframes halo{0%,100%{opacity:.55}50%{opacity:.95}}
.shoot{opacity:0;animation:shoot 9s ease-in infinite}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}4%{opacity:1}22%{transform:translate(340px,170px);opacity:0}100%{transform:translate(340px,170px);opacity:0}}
.title{opacity:0;animation:rise 1.6s ease-out .3s forwards}
.sub{opacity:0;animation:rise 1.6s ease-out 1s forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #a78bfa)}50%{filter:drop-shadow(0 0 14px #c4b5fd)}}
.w1{animation:wv 14s linear infinite}
.w2{animation:wv 22s linear infinite reverse}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-400px)}}
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#04060e"/><stop offset=".55" stop-color="#0c0f2a"/><stop offset="1" stop-color="#1a1145"/>
  </linearGradient>
  <radialGradient id="moon" cx=".38" cy=".35" r=".75">
    <stop offset="0" stop-color="#fffdf0"/><stop offset=".55" stop-color="#dcdff5"/><stop offset="1" stop-color="#8e94c9"/>
  </radialGradient>
  <radialGradient id="shade" cx=".3" cy=".3" r=".9">
    <stop offset=".55" stop-color="#0b0f1f" stop-opacity="0"/><stop offset="1" stop-color="#0b0f1f" stop-opacity=".55"/>
  </radialGradient>
  <radialGradient id="hl" cx=".5" cy=".5" r=".5">
    <stop offset=".35" stop-color="#c4b5fd" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e9d5ff"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="tail" x1="1" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>

